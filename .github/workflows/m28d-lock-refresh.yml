name: M28-D Router v7 Lock Refresh

on:
  push:
    branches:
      - agent/m28d-react-router-v7

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/m28d-react-router-v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Router v7 lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install resolved graph
        run: npm ci

      - name: Require zero audited vulnerabilities
        run: npm audit --audit-level=low

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:core

      - name: Persist lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "M28-D: resolve React Router v7 lock"
          git push origin HEAD:agent/m28d-react-router-v7
