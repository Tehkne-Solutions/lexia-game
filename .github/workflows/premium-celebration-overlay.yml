name: Lexia Premium Celebration Overlay

on:
  pull_request:
    paths:
      - 'src/components/game/CelebrationOverlay.jsx'
      - 'src/components/game/GamePanel.jsx'
      - 'src/components/game/GameActionButton.jsx'
      - 'scripts/check-premium-celebration-overlay.mjs'
      - '.github/workflows/premium-celebration-overlay.yml'
  workflow_dispatch:

jobs:
  premium-celebration-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: No-gradient learner chrome audit
        run: node scripts/check-no-gradient-learner-chrome.mjs
      - name: Premium action primitive audit
        run: node scripts/check-premium-action-primitives.mjs
      - name: Premium celebration overlay contract
        run: node scripts/check-premium-celebration-overlay.mjs
