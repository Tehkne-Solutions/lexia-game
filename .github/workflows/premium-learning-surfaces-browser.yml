name: Lexia Premium Learning Surfaces Browser

on:
  pull_request:
    paths:
      - 'src/pages/PlayGame.jsx'
      - 'src/pages/PlaySyllables.jsx'
      - 'src/pages/PlaySentences.jsx'
      - 'src/components/game/GameplayHud.jsx'
      - 'src/components/game/CurriculumGameplayHud.jsx'
      - 'src/components/game/GamePanel.jsx'
      - 'src/components/game/GameActionButton.jsx'
      - 'src/components/game/ProgressBar.jsx'
      - 'src/components/game/MascotAvatar.jsx'
      - 'src/components/game/OnScreenKeyboard.jsx'
      - 'src/styles/premium-game.css'
      - 'scripts/check-premium-onscreen-keyboard.mjs'
      - 'scripts/check-premium-learning-surfaces-browser.mjs'
      - '.github/workflows/premium-learning-surfaces-browser.yml'
  workflow_dispatch:

jobs:
  premium-learning-surfaces-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Premium UI foundation contract
        run: node scripts/check-premium-ui-foundation.mjs
      - name: Premium on-screen keyboard contract
        run: node scripts/check-premium-onscreen-keyboard.mjs
      - name: Journey engine contract
        run: node scripts/check-journey-engine.mjs
      - name: Session quest contract
        run: node scripts/check-session-quest.mjs
      - name: Prepare Chrome runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            echo "CHROME_BIN=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Premium learning surfaces browser QA
        run: node scripts/check-premium-learning-surfaces-browser.mjs
      - name: Upload M38-C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m38c-premium-learning-surfaces-browser
          path: artifacts/m38c-learning
          if-no-files-found: warn
