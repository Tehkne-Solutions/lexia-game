name: Lexia Premium UI Visual Proof

on:
  pull_request:
    paths:
      - 'src/styles/premium-game.css'
      - 'src/main.jsx'
      - 'scripts/check-premium-ui-foundation.mjs'
      - 'scripts/check-premium-ui-browser.mjs'
      - '.github/workflows/premium-ui-visual-proof.yml'
      - 'docs/M35B-PREMIUM-UI-VISUAL-PROOF.md'
  workflow_dispatch:

jobs:
  premium-ui-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Premium UI foundation contract
        run: node scripts/check-premium-ui-foundation.mjs
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Prepare Chrome runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            echo "CHROME_BIN=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Premium UI browser proof
        run: node scripts/check-premium-ui-browser.mjs
      - name: Upload M35-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m35b-premium-ui-proof
          path: artifacts/m35b
          if-no-files-found: warn
