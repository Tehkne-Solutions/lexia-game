name: Lexia No-Gradient Learner Chrome

on:
  pull_request:
    paths:
      - 'src/pages/Welcome.jsx'
      - 'src/pages/WorldMap.jsx'
      - 'src/pages/Profile.jsx'
      - 'src/pages/PracticeHub.jsx'
      - 'src/pages/PlayGame.jsx'
      - 'src/pages/PlaySyllables.jsx'
      - 'src/pages/PlaySentences.jsx'
      - 'src/pages/SpeedChallenge.jsx'
      - 'src/pages/StoryMode.jsx'
      - 'src/components/game/**'
      - 'src/styles/premium-game.css'
      - 'scripts/check-no-gradient-learner-chrome.mjs'
      - '.github/workflows/no-gradient-learner-chrome.yml'
  workflow_dispatch:

jobs:
  no-gradient-learner-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Premium UI foundation contract
        run: node scripts/check-premium-ui-foundation.mjs
      - name: No-gradient learner chrome audit
        run: node scripts/check-no-gradient-learner-chrome.mjs
