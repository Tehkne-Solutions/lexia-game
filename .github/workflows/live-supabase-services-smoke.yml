name: Lexia Live Supabase Services Smoke

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Private service to prove against the live upstream'
        required: true
        default: both
        type: choice
        options:
          - ai
          - email
          - both

permissions:
  contents: read

jobs:
  live-private-services-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lexia-live-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run disposable private-services proof
        env:
          LEXIA_LIVE_SUPABASE_URL: ${{ secrets.LEXIA_LIVE_SUPABASE_URL }}
          LEXIA_LIVE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LEXIA_LIVE_SUPABASE_PUBLISHABLE_KEY }}
          LEXIA_LIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LEXIA_LIVE_SUPABASE_SERVICE_ROLE_KEY }}
          LEXIA_LIVE_TEST_EMAIL: ${{ secrets.LEXIA_LIVE_TEST_EMAIL }}
          LEXIA_LIVE_TEST_PASSWORD: ${{ secrets.LEXIA_LIVE_TEST_PASSWORD }}
          LEXIA_LIVE_SERVICE_SCOPE: ${{ inputs.service }}
        run: node scripts/run-live-supabase-services-smoke.mjs
