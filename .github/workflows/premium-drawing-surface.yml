name: Lexia Premium Drawing Surface

on:
  pull_request:
    paths:
      - 'src/components/game/DrawingCanvas.jsx'
      - 'scripts/check-premium-drawing-surface.mjs'
      - '.github/workflows/premium-drawing-surface.yml'
  workflow_dispatch:

jobs:
  premium-drawing-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Premium action primitive audit
        run: node scripts/check-premium-action-primitives.mjs
      - name: Premium drawing surface contract
        run: node scripts/check-premium-drawing-surface.mjs
