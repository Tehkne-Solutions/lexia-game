name: M30-A Apply Daily Adventure Plan

on:
  push:
    branches:
      - agent/m30a-daily-adventure-plan

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m30-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m30a-daily-adventure-plan
          fetch-depth: 0

      - name: Apply M30 integration
        shell: python
        run: |
          from pathlib import Path

          welcome = Path('src/pages/Welcome.jsx')
          src = welcome.read_text()
          old_import = "import { getLearnerNextAction } from '@/game/learnerNextActionEngine';\n"
          new_import = old_import + "import { buildLearnerDailyPlan } from '@/game/learnerDailyPlanEngine';\n"
          if old_import not in src:
              raise SystemExit('Welcome import anchor missing')
          src = src.replace(old_import, new_import, 1)

          old_state = """  const primaryAction = useMemo(\n    () => getLearnerNextAction(journey, reviewQuest),\n    [journey, reviewQuest],\n  );\n  const missionPct = journey.total > 0 ? Math.round((journey.current / journey.total) * 100) : 0;\n  const dailyCompletedCount = getChallengeCompletedCount(dailyChallenge);\n"""
          new_state = """  const primaryAction = useMemo(\n    () => getLearnerNextAction(journey, reviewQuest),\n    [journey, reviewQuest],\n  );\n  const missionPct = journey.total > 0 ? Math.round((journey.current / journey.total) * 100) : 0;\n  const dailyCompletedCount = getChallengeCompletedCount(dailyChallenge);\n  const dailyPlan = useMemo(\n    () => buildLearnerDailyPlan({ journey, reviewQuest, dailyChallenge, dailyCompletedCount }),\n    [journey, reviewQuest, dailyChallenge, dailyCompletedCount],\n  );\n"""
          if old_state not in src:
              raise SystemExit('Welcome state anchor missing')
          src = src.replace(old_state, new_state, 1)

          insert_anchor = """          {reviewCompleted && !reviewQuest.hasDueReviews && (\n"""
          plan_ui = """          <motion.div\n            className=\"w-full max-w-xs rounded-2xl border border-border/80 bg-card/80 px-3 py-3 shadow-sm\"\n            initial={{ opacity: 0, y: 10 }}\n            animate={{ opacity: 1, y: 0 }}\n            transition={{ delay: 0.73 }}\n            aria-label=\"Plano de aventura\"\n          >\n            <div className=\"flex items-start justify-between gap-3\">\n              <div>\n                <p className=\"font-body text-[10px] uppercase tracking-[0.12em] font-bold text-primary\">Plano de aventura</p>\n                <p className=\"font-display text-sm text-foreground mt-0.5\">{dailyPlan.headline}</p>\n              </div>\n              <span className=\"font-body text-[10px] font-bold text-muted-foreground whitespace-nowrap\">\n                {dailyPlan.requiredCount} {dailyPlan.requiredCount === 1 ? 'passo' : 'passos'} + bônus\n              </span>\n            </div>\n            <p className=\"font-body text-xs text-muted-foreground mt-1\">{dailyPlan.summary}</p>\n            <div className=\"mt-3 space-y-2\">\n              {dailyPlan.steps.map((step, index) => (\n                <div key={`${step.kind}-${index}`} className=\"flex items-center gap-2\">\n                  <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold flex-none ${step.required ? 'bg-primary/10 text-primary' : 'bg-amber-100 text-amber-800'}`}>\n                    {step.completed ? '✓' : index + 1}\n                  </div>\n                  <div className=\"min-w-0 flex-1\">\n                    <div className=\"flex items-center gap-2\">\n                      <p className=\"font-body text-xs font-bold text-foreground truncate\">{step.title}</p>\n                      {!step.required && (\n                        <span className=\"font-body text-[9px] uppercase tracking-wide font-bold text-amber-700\">Opcional</span>\n                      )}\n                    </div>\n                    {step.progressTotal > 0 && (\n                      <p className=\"font-body text-[10px] text-muted-foreground\">\n                        {step.progressCurrent}/{step.progressTotal}\n                      </p>\n                    )}\n                  </div>\n                </div>\n              ))}\n            </div>\n          </motion.div>\n\n"""
          if insert_anchor not in src:
              raise SystemExit('Welcome plan insertion anchor missing')
          src = src.replace(insert_anchor, plan_ui + insert_anchor, 1)
          welcome.write_text(src)

          ci = Path('.github/workflows/ci.yml')
          ci_src = ci.read_text()
          ci_anchor = """      - name: Learner next action contract\n        run: node scripts/check-learner-next-action.mjs\n"""
          ci_insert = ci_anchor + """\n      - name: Learner daily plan contract\n        run: node scripts/check-learner-daily-plan.mjs\n"""
          if ci_anchor not in ci_src:
              raise SystemExit('CI anchor missing')
          ci.write_text(ci_src.replace(ci_anchor, ci_insert, 1))

          doc = Path('docs/M30-DAILY-ADVENTURE-PLAN.md')
          doc.write_text("""# Lexia M30 — Plano de Aventura do Dia\n\n**Tehkné Solutions**\n\n## M30-A — Plano derivado da jornada\n\nA Home passa a explicar a sessão como uma sequência curta e coerente, derivada exclusivamente dos sistemas canônicos já existentes.\n\n### Ordem\n\n1. revisão vencida, quando existir e nunca no primeiro acesso;\n2. missão curricular atual;\n3. desafio diário como bônus opcional.\n\n### Regras\n\n- nenhuma nova tabela, moeda, score, streak ou scheduler;\n- revisão usa `Learner Review Quest` e o exact review path;\n- missão usa o `Journey Engine`;\n- bônus usa o `Journey Daily Challenge`;\n- Fresh Start mantém a primeira missão como início absoluto;\n- o plano muda naturalmente quando o estado canônico muda.\n\n### UX\n\nA Home mostra um bloco compacto **Plano de aventura** com a ordem dos passos, quantidade obrigatória e progresso do bônus. Os cards detalhados e CTAs existentes permanecem disponíveis; o plano serve como orientação, não como nova navegação paralela.\n\n### Gate\n\n`scripts/check-learner-daily-plan.mjs` valida first-run, prioridade de revisão, retorno curricular, bônus opcional, progresso do desafio e integração na Home/CI.\n\n— Tehkné Solutions\n""")

      - name: Validate deterministic contract
        run: node scripts/check-learner-daily-plan.mjs

      - name: Commit integration
        run: |
          git config user.name "Tehkne Solutions Automation"
          git config user.email "automation@tehkne.invalid"
          git add src/pages/Welcome.jsx .github/workflows/ci.yml docs/M30-DAILY-ADVENTURE-PLAN.md
          git commit -m "feat(m30): integrate daily adventure plan [m30-applied]"
          git push origin HEAD:agent/m30a-daily-adventure-plan
