name: Lexia Premium Game Components

on:
  pull_request:
    paths:
      - 'src/components/game/GamePanel.jsx'
      - 'src/components/game/GameActionButton.jsx'
      - 'src/components/game/DailyChallengeCard.jsx'
      - 'src/styles/premium-game.css'
      - 'scripts/check-premium-game-components.mjs'
      - '.github/workflows/premium-game-components.yml'
      - 'docs/M36A-PREMIUM-GAME-COMPONENTS.md'
  workflow_dispatch:

jobs:
  premium-game-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Premium game component contract
        run: node scripts/check-premium-game-components.mjs
      - name: Premium UI foundation contract
        run: node scripts/check-premium-ui-foundation.mjs
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Build
        run: npm run build
      - name: Prepare Chrome runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            echo "CHROME_BIN=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Daily challenge browser regression
        run: node scripts/check-daily-challenge-browser.mjs
      - name: Premium UI browser regression
        run: node scripts/check-premium-ui-browser.mjs
      - name: Upload M36-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m36a-premium-game-components
          path: |
            artifacts/m35b
            artifacts/daily-challenge
          if-no-files-found: warn
