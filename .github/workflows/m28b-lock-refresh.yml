name: M28-B Lock Refresh

on:
  push:
    branches:
      - agent/m28b-read-resilience-boundary
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/m28b-read-resilience-boundary

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lock after dependency cleanup
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependency graph
        run: npm ci

      - name: Enforce no high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Promote permanent security gate and remove harness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '      - name: Dependency audit baseline\n        run: npm audit --json || true\n'
          new = '      - name: Dependency security gate\n        run: npm audit --audit-level=high\n'
          if old not in text:
              raise SystemExit('temporary dependency audit baseline not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/m28b-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml .github/workflows/m28b-lock-refresh.yml
          git commit -m "M28-B: finalize dependency security hardening"
          git push origin HEAD:agent/m28b-read-resilience-boundary
