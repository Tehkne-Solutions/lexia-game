name: M28-B Lock Refresh

on:
  push:
    branches:
      - agent/m28b-read-resilience-boundary
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  persist-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/m28b-read-resilience-boundary

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lock after dependency cleanup
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependency graph
        run: npm ci

      - name: Enforce no high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Persist lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "M28-B: remove unused Quill stack from lock"
          git push origin HEAD:agent/m28b-read-resilience-boundary
