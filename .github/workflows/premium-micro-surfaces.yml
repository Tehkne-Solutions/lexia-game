name: Lexia Premium Micro-Surfaces

on:
  pull_request:
    paths:
      - 'src/components/game/LetterDisplay.jsx'
      - 'src/components/game/DailyChallengeCard.jsx'
      - 'scripts/check-premium-micro-surfaces.mjs'
      - '.github/workflows/premium-micro-surfaces.yml'
  workflow_dispatch:

jobs:
  premium-micro-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: No-gradient learner chrome audit
        run: node scripts/check-no-gradient-learner-chrome.mjs
      - name: Premium action primitive audit
        run: node scripts/check-premium-action-primitives.mjs
      - name: Premium micro-surfaces contract
        run: node scripts/check-premium-micro-surfaces.mjs
