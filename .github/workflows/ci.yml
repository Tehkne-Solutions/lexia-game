name: Lexia CI

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck legacy baseline
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
