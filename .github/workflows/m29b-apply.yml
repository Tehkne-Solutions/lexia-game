name: M29-B Apply Adaptive Primary Action

on:
  push:
    branches:
      - agent/m29b-adaptive-primary-action

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/m29b-adaptive-primary-action

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply M29-B patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          welcome = Path('src/pages/Welcome.jsx')
          source = welcome.read_text()

          old = "import { buildLearnerReviewQuest, getLearnerReviewQuestLabel } from '@/game/learnerReviewQuestEngine';\n"
          new = old + "import { getLearnerNextAction } from '@/game/learnerNextActionEngine';\n"
          assert old in source and 'getLearnerNextAction' not in source
          source = source.replace(old, new, 1)

          old = "  const reviewQuest = useMemo(\n    () => buildLearnerReviewQuest(visibleProgress),\n    [visibleProgress],\n  );\n  const missionPct"
          new = "  const reviewQuest = useMemo(\n    () => buildLearnerReviewQuest(visibleProgress),\n    [visibleProgress],\n  );\n  const primaryAction = useMemo(\n    () => getLearnerNextAction(journey, reviewQuest),\n    [journey, reviewQuest],\n  );\n  const missionPct"
          assert old in source
          source = source.replace(old, new, 1)

          old = "      speak(journey.firstRun\n        ? `Olá! Eu sou a Corujinha! Sua primeira missão é descobrir a letra ${journey.target}.`\n        : 'Olá! Eu sou a Corujinha! Vamos continuar nossa jornada?');\n    }, 800);\n    return () => clearTimeout(timer);\n  }, [journey.firstRun, journey.target]);"
          new = "      speak(journey.firstRun\n        ? `Olá! Eu sou a Corujinha! Sua primeira missão é descobrir a letra ${journey.target}.`\n        : primaryAction.kind === 'review'\n          ? 'Você tem revisões prontas. Vamos reforçar o que já aprendeu antes de continuar?'\n          : 'Olá! Eu sou a Corujinha! Vamos continuar nossa jornada?');\n    }, 800);\n    return () => clearTimeout(timer);\n  }, [journey.firstRun, journey.target, primaryAction.kind]);"
          assert old in source
          source = source.replace(old, new, 1)

          old = "            message={showMessage ? (journey.firstRun ? `Sua primeira missão: letra ${journey.target}!` : journey.title) : undefined}"
          new = "            message={showMessage ? (journey.firstRun ? `Sua primeira missão: letra ${journey.target}!` : primaryAction.title) : undefined}"
          assert old in source
          source = source.replace(old, new, 1)

          old = "            <Link to={journey.path} className=\"w-full\">"
          new = "            <Link to={primaryAction.path} className=\"w-full\">"
          assert old in source
          source = source.replace(old, new, 1)

          old = "                {journey.cta}\n"
          new = "                {primaryAction.cta}\n"
          assert old in source
          source = source.replace(old, new, 1)

          welcome.write_text(source)

          ci = Path('.github/workflows/ci.yml')
          ci_source = ci.read_text()
          old = "      - name: Learner review quest contract\n        run: node scripts/check-learner-review-quest.mjs\n\n      - name: Exact review handoff contract"
          new = "      - name: Learner review quest contract\n        run: node scripts/check-learner-review-quest.mjs\n\n      - name: Learner next action contract\n        run: node scripts/check-learner-next-action.mjs\n\n      - name: Exact review handoff contract"
          assert old in ci_source and 'Learner next action contract' not in ci_source
          ci.write_text(ci_source.replace(old, new, 1))
          PY

      - name: Validate patch
        run: |
          node scripts/check-learner-next-action.mjs
          npm run typecheck
          npm run typecheck:core
          npm run lint

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Welcome.jsx .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "M29-B: make Home primary action adaptive"
          git push origin HEAD:agent/m29b-adaptive-primary-action
