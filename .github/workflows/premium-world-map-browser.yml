name: Lexia Premium World Map Browser

on:
  pull_request:
    paths:
      - 'src/pages/WorldMap.jsx'
      - 'src/components/game/GamePanel.jsx'
      - 'src/components/game/GameActionButton.jsx'
      - 'src/lib/worldMap.js'
      - 'src/styles/premium-game.css'
      - 'scripts/check-premium-world-map-browser.mjs'
      - '.github/workflows/premium-world-map-browser.yml'
  workflow_dispatch:

jobs:
  premium-world-map-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck UI
        run: npm run typecheck
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Premium UI foundation contract
        run: node scripts/check-premium-ui-foundation.mjs
      - name: Journey engine contract
        run: node scripts/check-journey-engine.mjs
      - name: World experience contract
        run: node scripts/check-world-experience.mjs
      - name: Curriculum worlds contract
        run: node scripts/check-curriculum-worlds.mjs
      - name: Prepare Chrome runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            echo "CHROME_BIN=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Premium world map browser QA
        run: node scripts/check-premium-world-map-browser.mjs
      - name: Upload M38-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m38b-premium-world-map-browser
          path: artifacts/m38b-world
          if-no-files-found: warn
